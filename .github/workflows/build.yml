# Builds AuroraPAR on GitHub's Windows machines at every push.
# The ready-to-run program is attached to each run as "AuroraPAR-win-x64"
# (Actions tab -> latest run -> Artifacts). It does not require .NET to be installed.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: >
          dotnet publish AuroraPAR.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Add the user manual
        run: Copy-Item docs/MANUAL.md publish/MANUAL.md

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraPAR-win-x64
          path: |
            publish/AuroraPAR.exe
            publish/runways.par
            publish/MANUAL.md
            publish/Profiles/*.json

      - name: Build AuroraCoord (standalone coordination panel)
        run: >
          dotnet publish Coord/AuroraCoord.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-coord

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraCoord-win-x64
          path: publish-coord/AuroraCoord.exe
